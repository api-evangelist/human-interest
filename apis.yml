aid: human-interest
name: Human Interest
description: >-
  Human Interest is a fintech company providing affordable, full-service
  401(k), 403(b), and IRA retirement plans built for small and medium-sized
  businesses. Founded to close the retirement savings gap, it combines automated
  plan administration, 600+ payroll integrations, and low-cost index-fund
  investing. For platforms and partners it publishes a GraphQL API
  (https://api.humaninterest.com/v1/graphql) that lets them onboard retirement
  plans end to end, integrate OpenID Connect single sign-on, and subscribe to
  webhook events, all documented at docs.humaninterest.com. Human Interest
  maintains a SafeBase trust center with SOC 1, SOC 2 Type 1 & 2, GLBA, and
  CCPA attestations plus a responsible-disclosure program.
